# Questo è il workflow di GitHub Actions per deployare la tua app React/Vite su GitHub Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - trunk # O 'trunk' se il tuo branch principale si chiama così

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # NUOVO: Forza una nuova storia per il branch di deploy, utile per risolvere conflitti
          # o problemi di stato con il branch gh-pages.
          force_orphan: true
