# Questo è il workflow di GitHub Actions per deployare la tua app React/Vite su GitHub Pages.

name: Deploy to GitHub Pages

on:
  # Lancia il workflow ogni volta che c'è un push sul branch 'trunk'
  push:
    branches:
      - trunk # O 'master' se il tuo branch principale si chiama così

  # Permetti di lanciare il workflow manualmente dalla UI di GitHub Actions
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Eseguiamo il job su un ambiente Linux pulito

    steps:
      - name: Checkout Code # Clona il tuo repository
        uses: actions/checkout@v4

      - name: Setup Node.js # Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specifica la versione di Node.js che usi localmente (o una versione stabile)
          cache: 'npm' # Abilita il caching delle dipendenze per velocizzare le build

      - name: Install Dependencies # Installa le dipendenze del progetto
        run: npm install

      - name: Build Project # Costruisce l'applicazione React/Vite in produzione
        run: npm run build

      - name: Deploy to GitHub Pages # Deplora il contenuto della cartella 'dist'
        uses: peaceiris/actions-gh-pages@v3 # Un'azione popolare per il deploy su gh-pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Token fornito automaticamente da GitHub
          publish_dir: ./dist # La cartella da pubblicare (generata da 'npm run build')
          publish_branch: gh-pages # Il branch su cui pubblicare i file del sito
          # Se preferisci pubblicare direttamente sul branch 'trunk' e servirlo da lì,
          # imposta publish_branch: trunk e configura GitHub Pages per servire da 'trunk'
          # ATTENZIONE: Se pubblichi su 'trunk', i file sorgente non saranno visibili
          # nel repository, solo i file della build.
